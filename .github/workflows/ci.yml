name: ExoSpecMiner CI/CD Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Run Automated Benchmarks (Accuracy, Uncertainty, Speed)
      run: |
        python verify_exospecminer.py

    - name: Run Local Smoke Test & Downscaling Playbook
      run: |
        python run_local_smoke_test.py

    - name: Upload Verification Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: exospecminer-verification-reports-py${{ matrix.python-version }}
        path: |
          exospecminer_benchmark_report.md
          wasp39b_verification_study/
